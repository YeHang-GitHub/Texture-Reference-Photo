name: Generate Thumbnails and JSON

on:
  workflow_dispatch:
  push:
    paths:
      - "Images/**"
      - "generate_thumbnails.py"
      - "generate_json.py"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Free disk space BEFORE checkout
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo apt-get clean
        sudo apt-get autoremove -y
        df -h

    - name: Checkout with full history (shallow for large files)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: false

    - name: Clean git history to save space
      run: |
        git gc --aggressive --prune=now
        df -h

    - name: Install system libraries (JPEG/PNG/WEBP only)
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-dev libpng-dev libwebp-dev
        sudo apt-get clean
        df -h

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Python dependencies (clean, no cache)
      run: |
        pip install --no-cache-dir pillow

    - name: Run thumbnail generator
      run: python generate_thumbnails.py

    - name: Run JSON generator
      run: python generate_json.py

    - name: Commit and push changes
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"
        git add Thumbnails directory_cache.json
        git commit -m "Auto update thumbnails and JSON" || echo "No changes"
        git push
