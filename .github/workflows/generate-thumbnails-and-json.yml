name: Generate Thumbnails and JSON

on:
  push:
    paths:
      - 'Images/**'
      - 'generate_thumbnails.py'
      - 'generate_json.py'
  workflow_dispatch:   # 手动运行也可以

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install AVIF system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libavif-dev \
          libaom-dev \
          libjpeg-dev \
          libpng-dev \
          libwebp-dev

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow
        pip install pillow-avif-plugin

    - name: Generate Thumbnails
      run: |
        python generate_thumbnails.py

    - name: Generate JSON
      run: |
        python generate_json.py

    - name: Commit and push changes
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"
        git add Thumbnails directory_cache.json
        git commit -m "Auto-generate thumbnails and JSON" || echo "No changes to commit"
        git push
